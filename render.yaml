services:
  - type: web
    name: angel-filter
    runtime: python
    # requirements.txt is generated from poetry.lock, so this installs exactly
    # what CI tests — including the NLIP libraries. Check /health after deploy:
    # "mode" must be "nlip", or the UI cannot search.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn angel_filter.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"

      # There is no login: anyone with the URL can search, and every search
      # spends provider credit. These limits are the only protection.
      - key: ANGEL_DAILY_QUERY_LIMIT
        value: "200"
      - key: ANGEL_USER_RATE_LIMIT
        value: "20"
      - key: ANGEL_USER_RATE_WINDOW
        value: "60"
      # Render's proxy puts the caller's IP in X-Forwarded-For. 1 = trust the
      # entry it adds. Verify after deploying (docs/SETUP.md, "Deploying").
      - key: ANGEL_TRUSTED_PROXY_HOPS
        value: "1"
      # Postgres for shared state: Supabase's Session pooler URL (free tier,
      # see docs/SETUP.md). Without it, every restart resets the limits,
      # including the daily cap.
      - key: ANGEL_DATABASE_URL
        sync: false

      # Provider keys — set in the Render dashboard, never commit them.
      # OPENAI_API_KEY also provides embeddings, since Ollama can't run here.
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: BRAVE_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: WATSONX_API_KEY
        sync: false
      - key: WATSONX_PROJECT_ID
        sync: false
