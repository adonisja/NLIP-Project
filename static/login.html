<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Angel Filter — Sign in</title>
<style>
  :root { --bg: #0f1420; --card: #1a2032; --ink: #e8ecf5; --muted: #93a0b8; --accent: #6aa9ff; --warn: #ffb36a; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; display: grid; place-items: center; }
  main { width: 100%; max-width: 380px; padding: 24px; text-align: center; }
  h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin-bottom: 24px; font-size: 14px; }
  .panel { background: var(--card); border: 1px solid #2a3450; border-radius: 12px; padding: 28px 24px; }
  a.btn { display: inline-flex; align-items: center; gap: 10px; font: inherit; color: #081020; background: var(--accent); border: none; border-radius: 10px; padding: 12px 18px; font-weight: 600; text-decoration: none; cursor: pointer; }
  a.btn:hover { filter: brightness(1.1); }
  .error { color: var(--warn); font-size: 14px; margin-top: 16px; min-height: 1.4em; }
  svg { width: 18px; height: 18px; }
  .note { color: var(--muted); font-size: 12px; margin-top: 20px; }
</style>
</head>
<body>
<main>
  <h1>Angel Filter</h1>
  <p class="sub">Access is by invitation. Sign in with your GitHub account.</p>
  <div class="panel">
    <a class="btn" href="/auth/github/login">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.28-.01-1.01-.02-1.99-3.2.69-3.88-1.54-3.88-1.54-.52-1.33-1.28-1.69-1.28-1.69-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.03 1.76 2.69 1.25 3.35.96.1-.74.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.47.11-3.07 0 0 .97-.31 3.18 1.18.92-.26 1.91-.39 2.9-.39.98 0 1.97.13 2.9.39 2.2-1.49 3.17-1.18 3.17-1.18.63 1.6.23 2.78.11 3.07.74.81 1.19 1.84 1.19 3.1 0 4.42-2.7 5.39-5.27 5.68.41.36.78 1.06.78 2.15 0 1.55-.01 2.8-.01 3.18 0 .31.21.68.8.56C20.21 21.39 23.5 17.08 23.5 12 23.5 5.65 18.35.5 12 .5z"/></svg>
      Sign in with GitHub
    </a>
    <p class="error" id="err"></p>
  </div>
  <p class="note">Not on the allowlist? Ask the project owner to add your GitHub username.</p>
</main>
<script>
// Surface specific error reasons passed by the server via ?error=...
// All messages are static strings — no untrusted content is interpolated.
const params = new URLSearchParams(location.search);
const err = params.get("error");
if (err) {
  document.getElementById("err").textContent =
    err === "forbidden"       ? "Your GitHub account is not on the allowlist for this app." :
    err === "state_mismatch"  ? "Login session expired. Please try again." :
    err === "github_denied"   ? "GitHub authorization was cancelled." :
    err === "exchange_failed" ? "Could not verify your GitHub login. Please try again." :
                                "Sign-in failed. Please try again.";
}
</script>
</body>
</html>
